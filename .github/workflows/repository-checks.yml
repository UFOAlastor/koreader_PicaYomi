name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends luajit
      - name: Check release snapshot
        run: python3 .github/scripts/check_repository.py
