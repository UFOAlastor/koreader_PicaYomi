name: 功能建议
description: 提出使用需求或改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      description: 描述使用场景及目前遇到的困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法或补充信息（选填）
